services:

  portfolio:
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s